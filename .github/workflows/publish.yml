name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing via OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          # When triggered by a release, check out the release's tag commit
          # (not the default branch HEAD).
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Node 24 ships with npm >= 11.5.1, which is the minimum for OIDC trusted publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn artifacts
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG pkg=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ${TAG} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: auth happens via OIDC against the configured
      # npm trusted publisher. Provenance is generated automatically when
      # publishing via trusted publishing from a public repository.
      - name: Publish to npm
        run: npm publish --access public
